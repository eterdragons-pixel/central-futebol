const tabs=[['inicio','🏠 Início'],['teams','🛡️ Clubes'],['players','👤 Jogadores'],['competitions','🏆 Campeonatos'],['rounds','🗓️ Rodadas'],['matches','⚽ Partidas'],['stats','📊 Estatísticas'],['backup','💾 Backup']];function go(t){tab=t;edit={};render()}function startEdit(t,i){tab=t;edit[t]=db[t].find(x=>x.id===i);render();window.scrollTo(0,0)}function removeItem(t,i){if(!confirm('Excluir este registro? Referências em outros registros podem ficar sem vínculo.'))return;db[t]=db[t].filter(x=>x.id!==i);save();render()}function formSubmit(e,t){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));const old=edit[t];if(t==='matches'&&(!o.homeId||!o.awayId||o.homeId===o.awayId))return alert('Escolha dois clubes diferentes.');if(old)Object.assign(old,o);else db[t].push({...o,id:id(),...(t==='matches'?{events:[]}: {})});edit={};save();render()}
function render(){ $('nav').innerHTML=tabs.map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');$('app').innerHTML=({inicio:home,teams:teams,players:players,competitions:competitions,rounds:rounds,matches:matches,stats:stats,backup:backup,profile21:profilePage21})[tab]();}
function home(){const goals=db.matches.flatMap(m=>m.events||[]).filter(e=>e.type==='goal').length;return `<div class="grid">${[['Clubes',db.teams.length],['Jogadores',db.players.length],['Campeonatos',db.competitions.length],['Partidas',db.matches.length],['Gols',goals]].map(([a,b])=>`<div class="panel"><small>${a}</small><div class="score">${b}</div></div>`).join('')}</div><div class="panel"><h2>Bem-vindo à Central</h2><p>Cadastre clubes e jogadores, crie um campeonato e registre suas partidas. Gols e cartões atualizam automaticamente as súmulas e estatísticas.</p><button class="primary" onclick="go('teams')">Começar pelos clubes</button></div>`}
function teams(){let x=edit.teams||{};return `<div class="panel"><h2>${x.id?'Editar':'Novo'} clube</h2><form onsubmit="formSubmit(event,'teams')">${field('Nome','name',x.name,'text','required')}${field('Cidade','city',x.city)}${field('País','country',x.country)}<button class="primary">Salvar clube</button></form></div><div class="panel"><h2>Clubes (${db.teams.length})</h2>${db.teams.map(x=>`<div class="item"><b>${esc(x.name)}</b> <small>${esc(x.city)} ${esc(x.country)}</small><div class="actions">${buttons('teams',x)}</div></div>`).join('')||'Nenhum clube cadastrado.'}</div>`}
function players(){let x=edit.players||{};const grouped=[...db.players].sort((a,b)=>name('teams',a.teamId).localeCompare(name('teams',b.teamId))||String(a.name).localeCompare(String(b.name)));return `<div class="panel"><h2>👤 Gerenciamento de elenco</h2><p class="muted">Cadastre e edite atletas a qualquer momento, mesmo sem escalação, partida ou campeonato. Alterações preservam o ID e as estatísticas do jogador.</p><h3>${x.id?'Editar jogador: '+esc(x.name):'Novo jogador'}</h3><form onsubmit="formSubmit(event,'players')"><div class="grid">${field('Nome','name',x.name,'text','required')}${select('Clube (opcional: agente livre)','teamId','teams',x.teamId)}${field('Número','number',x.number,'number','min="0"')}${field('Posição','position',x.position)}${field('Nacionalidade','nationality',x.nationality)}${field('Idade','age',x.age,'number','min="0"')}</div><div class="actions"><button class="primary">${x.id?'Salvar alterações':'Adicionar jogador'}</button>${x.id?'<button type="button" onclick="edit={};render()">Cancelar edição</button>':''}</div></form></div><div class="panel"><h2>Elenco completo (${db.players.length})</h2><label>Buscar jogador<input id="playerSearch" placeholder="Nome, clube ou posição" oninput="filterPlayerRows()"></label><div id="playerRows">${grouped.map(p=>`<div class="item player-row" data-search="${esc((p.name+' '+(p.position||'')+' '+(p.teamId?name('teams',p.teamId):'Agente livre')).toLowerCase())}"><b>${esc(p.name)}</b> <span class="pill">#${esc(p.number||'?')}</span><p class="muted">${p.teamId?esc(name('teams',p.teamId)):'Agente livre'} · ${esc(p.position||'Sem posição')}</p><div class="actions"><button class="primary" onclick="startEdit('players','${p.id}')">✏️ Editar cadastro</button><button class="danger" onclick="removeItem('players','${p.id}')">Excluir</button></div></div>`).join('')||'<p>Nenhum jogador cadastrado.</p>'}</div></div>`}
function filterPlayerRows(){let q=($('playerSearch')?.value||'').toLocaleLowerCase();document.querySelectorAll('.player-row').forEach(el=>el.style.display=el.dataset.search.includes(q)?'':'none')}

function competitions(){let x=edit.competitions||{};return `<div class="panel"><h2>${x.id?'Editar':'Novo'} campeonato</h2><form onsubmit="formSubmit(event,'competitions')">${field('Nome','name',x.name,'text','required')}${field('Temporada','season',x.season||'2026')}${field('Descrição','description',x.description)}<button class="primary">Salvar campeonato</button></form></div><div class="panel"><h2>Campeonatos</h2>${db.competitions.map(x=>`<div class="item"><b>${esc(x.name)}</b> <small>${esc(x.season)}</small><div class="actions">${buttons('competitions',x)} <button onclick="selectedCompetition='${x.id}';go('rounds')">🗓️ Rodadas</button></div></div>`).join('')||'Nenhum campeonato cadastrado.'}</div>`}
function roundRobin(ids){let a=[...ids];if(a.length%2)a.push(null);const n=a.length,out=[];for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)pairs.push(r%2?[y,x]:[x,y])}out.push(pairs);a=[a[0],a[n-1],...a.slice(1,n-1)]}return out}
function generateRounds(ev){ev.preventDefault();const f=new FormData(ev.target),cid=f.get('competitionId'),ids=f.getAll('teams');if(!cid)return alert('Selecione um campeonato.');if(ids.length<2)return alert('Escolha pelo menos dois clubes.');if(db.matches.some(m=>m.competitionId===cid)&&!confirm('Este campeonato já tem partidas. Adicionar rodadas ao calendário existente?'))return;const existing=db.matches.filter(m=>m.competitionId===cid);let start=Math.max(0,...existing.map(m=>Number(m.round)||0))+1;const first=roundRobin(ids);let all=[...first];if(f.get('format')==='double')all.push(...first.map(r=>r.map(([h,a])=>[a,h])));for(let r=0;r<all.length;r++)for(const [homeId,awayId] of all[r])db.matches.push({id:id(),homeId,awayId,competitionId:cid,round:String(start+r),date:'',stadium:'',referee:'',status:'scheduled',events:[]});selectedCompetition=cid;save();render();alert(all.length+' rodadas criadas!')}
function createRound(ev){ev.preventDefault();const f=new FormData(ev.target),cid=f.get('competitionId');if(!cid)return alert('Selecione um campeonato.');const next=Math.max(0,...db.matches.filter(m=>m.competitionId===cid).map(m=>Number(m.round)||0))+1;db.matches.push({id:id(),homeId:f.get('homeId'),awayId:f.get('awayId'),competitionId:cid,round:String(f.get('round')||next),date:f.get('date')||'',stadium:'',referee:'',status:'scheduled',events:[]});const m=db.matches.at(-1);if(!m.homeId||!m.awayId||m.homeId===m.awayId){db.matches.pop();return alert('Escolha dois clubes diferentes.')}selectedCompetition=cid;save();render()}
function rounds(){const cid=selectedCompetition||db.competitions[0]?.id||'';selectedCompetition=cid;const cm=db.matches.filter(m=>m.competitionId===cid).sort((a,b)=>(Number(a.round)||0)-(Number(b.round)||0));const groups={};for(const m of cm)(groups[m.round||'Sem rodada']??=[]).push(m);return `<div class="panel"><h2>🗓️ Calendário de rodadas</h2><label>Campeonato<select onchange="selectedCompetition=this.value;render()">${options('competitions',cid)}</select></label><p class="muted">Selecione os clubes participantes e gere o calendário. Você pode editar cada confronto, data, horário e súmula depois.</p></div><div class="panel"><h3>Gerar automaticamente</h3><form onsubmit="generateRounds(event)"><input type="hidden" name="competitionId" value="${esc(cid)}"><label>Formato<select name="format"><option value="single">Turno único</option><option value="double">Ida e volta</option></select></label><p>Clubes participantes:</p><div class="grid">${db.teams.map(t=>`<label><input style="width:auto;margin-right:8px" type="checkbox" name="teams" value="${esc(t.id)}" checked>${esc(t.name)}</label>`).join('')||'Cadastre clubes primeiro.'}</div><p class="muted">Com número ímpar de clubes, uma equipe folga por rodada.</p><button class="primary" ${!cid?'disabled':''}>⚡ Gerar rodadas</button></form></div><div class="panel"><h3>Adicionar confronto manualmente</h3><form onsubmit="createRound(event)"><input type="hidden" name="competitionId" value="${esc(cid)}"><div class="grid">${select('Mandante','homeId','teams')}${select('Visitante','awayId','teams')}${field('Rodada (opcional)','round','','number','min="1"')}${field('Data','date','','date')}</div><button class="primary" ${!cid?'disabled':''}>Adicionar partida</button></form></div>${Object.entries(groups).map(([r,ms])=>`<div class="panel"><h3>Rodada ${esc(r)}</h3>${ms.map(m=>{let [h,a]=score(m);return `<div class="item"><b>${esc(name('teams',m.homeId))} ${h} × ${a} ${esc(name('teams',m.awayId))}</b><p class="muted">${esc(m.date||'Data a definir')} · ${m.status==='finished'?'Finalizada':m.status==='live'?'Em andamento':'Agendada'}</p><div class="actions"><button onclick="startEdit('matches','${m.id}')">Editar confronto</button><button class="primary" onclick="selectedMatch='${m.id}';tab='report';render()">Abrir súmula</button><button class="danger" onclick="removeItem('matches','${m.id}')">Excluir</button></div></div>`}).join('')}</div>`).join('')||'<div class="panel">Nenhuma rodada criada neste campeonato.</div>'}`}
function score(m){let h=0,a=0;for(const e of m.events||[])if(e.type==='goal'){if(e.teamId===m.homeId)h++;if(e.teamId===m.awayId)a++}return [h,a]}
function matches(){let x=edit.matches||{};return `<div class="panel"><h2>${x.id?'Editar':'Nova'} partida</h2><form onsubmit="formSubmit(event,'matches')"><div class="grid">${select('Mandante','homeId','teams',x.homeId)}${select('Visitante','awayId','teams',x.awayId)}${select('Campeonato','competitionId','competitions',x.competitionId)}${field('Data','date',x.date||new Date().toISOString().slice(0,10),'date')}${field('Rodada','round',x.round,'number','min="1"')}${field('Estádio','stadium',x.stadium)}${field('Árbitro','referee',x.referee)}</div><label>Estado<select name="status"><option value="scheduled" ${x.status==='scheduled'?'selected':''}>Agendada</option><option value="live" ${x.status==='live'?'selected':''}>Em andamento</option><option value="finished" ${x.status==='finished'?'selected':''}>Finalizada</option></select></label><button class="primary">Salvar partida</button></form></div><div class="panel"><h2>Partidas</h2>${db.matches.map(m=>{let [h,a]=score(m);return `<div class="item"><b>${esc(name('teams',m.homeId))} ${h} × ${a} ${esc(name('teams',m.awayId))}</b><p class="muted">${esc(m.date)} · Rodada ${esc(m.round||'?')} · ${esc(name('competitions',m.competitionId))} · ${m.status==='finished'?'Finalizada':m.status==='live'?'Em andamento':'Agendada'}</p><div class="actions"><button class="primary" onclick="selectedMatch='${m.id}';tab='report';render()">Abrir súmula</button>${buttons('matches',m)}</div></div>`}).join('')||'Nenhuma partida cadastrada.'}</div>`}
const types={goal:'⚽ Gol',yellow:'🟨 Cartão amarelo',red:'🟥 Cartão vermelho',sub:'🔁 Substituição',note:'📝 Observação'};
function lineupSection(m){
 const saved=m.lineups||{};
 return `<div class="panel"><h2>📋 Escalações da partida</h2><p class="muted">Marque os titulares de cada clube. Os demais jogadores ficam no banco de reservas. Salve para manter a escalação desta partida.</p><form onsubmit="saveLineups(event,'${m.id}')">${[m.homeId,m.awayId].map(t=>{
 const squad=db.players.filter(p=>p.teamId===t), chosen=saved[t]||squad.slice(0,11).map(p=>p.id);
 return `<h3>${esc(name('teams',t))}</h3>${squad.length?squad.map(p=>`<label class="lineup-player"><input type="checkbox" name="starter_${esc(t)}" value="${esc(p.id)}" ${chosen.includes(p.id)?'checked':''}> #${esc(p.number||'?')} ${esc(p.name)} <small>(${esc(p.position||'Sem posição')})</small></label>`).join(''):'<p class="muted">Cadastre jogadores neste clube.</p>'}`;
 }).join('')}<button class="primary">Salvar escalações</button></form></div>`;
}
function saveLineups(ev,mid){ev.preventDefault();const m=db.matches.find(x=>x.id===mid);if(!m)return;const f=new FormData(ev.target);m.lineups={};for(const t of [m.homeId,m.awayId]){const a=f.getAll('starter_'+t);if(a.length>11)return alert('Selecione no máximo 11 titulares por clube.');m.lineups[t]=a}save();render();alert('Escalações salvas!')}
function report(){let m=db.matches.find(x=>x.id===selectedMatch);if(!m){tab='matches';return matches()}let [h,a]=score(m),events=[...(m.events||[])].sort((a,b)=>Number(a.minute)-Number(b.minute));return `<div class="actions"><button onclick="go('matches')">← Partidas</button><button onclick="print()">Imprimir / PDF</button></div><div class="panel"><small>${esc(name('competitions',m.competitionId))} · ${esc(m.date)} · ${esc(m.round||'')}</small><div class="score">${esc(name('teams',m.homeId))}<br>${h} × ${a}<br>${esc(name('teams',m.awayId))}</div><p>Estádio: ${esc(m.stadium||'Não informado')} | Árbitro: ${esc(m.referee||'Não informado')}</p></div><div class="panel"><h2>Adicionar evento</h2><form onsubmit="addEvent(event,'${m.id}')"><div class="grid">${field('Minuto','minute','','number','min="0" required')}<label>Tipo<select name="type">${Object.entries(types).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Equipe<select name="teamId" id="eventTeam" onchange="updateEventPlayers('${m.id}')"><option value="${esc(m.homeId)}">${esc(name('teams',m.homeId))}</option><option value="${esc(m.awayId)}">${esc(name('teams',m.awayId))}</option></select></label><label>Jogador<select name="playerId" id="eventPlayer"></select></label><label>Assistência / jogador relacionado<select name="secondaryId" id="eventSecondary"></select></label></div><label>Observação<textarea name="note"></textarea></label><button class="primary">Registrar evento</button></form></div><div class="panel"><h2>Súmula e linha do tempo</h2>${events.map(e=>`<div class="item"><b>${esc(e.minute)}' ${types[e.type]||esc(e.type)}</b> · ${esc(name('teams',e.teamId))}<p>${esc(name('players',e.playerId))}${e.secondaryId?' · '+(e.type==='goal'?'Assistência: ':'Relacionado: ')+esc(name('players',e.secondaryId)):''}</p><small>${esc(e.note||'')}</small><div><button onclick="editEvent('${m.id}','${e.id}')">Editar evento</button> <button class="danger" onclick="deleteEvent('${m.id}','${e.id}')">Excluir evento</button></div></div>`).join('')||'Sem eventos registrados.'}</div>${lineupSection(m)}`}
function updateEventPlayers(mid){let t=$('eventTeam')?.value;let o='<option value="">Selecione</option>'+db.players.filter(p=>p.teamId===t).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('eventPlayer').innerHTML=o;$('eventSecondary').innerHTML=o}function addEvent(ev,mid){ev.preventDefault();let m=db.matches.find(x=>x.id===mid),e=Object.fromEntries(new FormData(ev.target));if(e.type==='goal'&&!e.playerId)return alert('Selecione o autor do gol.');if(e.playerId&&e.playerId===e.secondaryId)return alert('Selecione jogadores diferentes.');m.events??=[];m.events.push({...e,id:id()});save();render()}function editEvent(mid,eid){
 const m=db.matches.find(x=>x.id===mid),e=m?.events?.find(x=>x.id===eid);if(!e)return;
 const minute=prompt('Minuto:',e.minute);if(minute===null)return;if(!/^\d{1,3}$/.test(minute))return alert('Minuto inválido.');
 const kind=prompt('Tipo: goal (gol), yellow (amarelo), red (vermelho), sub (substituição), note (observação)',e.type);if(kind===null)return;if(!types[kind])return alert('Tipo inválido.');
 const team=prompt('Equipe: 1 = '+name('teams',m.homeId)+'; 2 = '+name('teams',m.awayId),e.teamId===m.homeId?'1':'2');if(team===null)return;if(!['1','2'].includes(team))return alert('Equipe inválida.');
 const teamId=team==='1'?m.homeId:m.awayId;const squad=db.players.filter(p=>p.teamId===teamId);
 const roster=squad.map((p,i)=>`${i+1}: ${p.name}`).join('\n');
 const current=squad.findIndex(p=>p.id===e.playerId);
 const primary=prompt('Jogador (número da lista; 0 para nenhum):\n'+roster,current>=0?String(current+1):'0');if(primary===null)return;
 const ix=Number(primary);if(!Number.isInteger(ix)||ix<0||ix>squad.length)return alert('Jogador inválido.');
 if(kind==='goal'&&ix===0)return alert('Gol precisa de autor.');
 const secondary=prompt('Assistente / jogador relacionado (número da lista; 0 para nenhum):\n'+roster,'0');if(secondary===null)return;
 const sx=Number(secondary);if(!Number.isInteger(sx)||sx<0||sx>squad.length)return alert('Jogador relacionado inválido.');
 if(ix&&ix===sx)return alert('Escolha jogadores diferentes.');
 const note=prompt('Observação:',e.note||'');if(note===null)return;
 Object.assign(e,{minute,type:kind,teamId,playerId:ix?squad[ix-1].id:'',secondaryId:sx?squad[sx-1].id:'',note});save();render();

function crest15(teamId, size='small'){
 const team=db.teams.find(t=>t.id===teamId);
 if(!team)return '';
 const image=typeof team.crest==='string'&&/^data:image\/(png|jpeg|webp);base64,/i.test(team.crest)?team.crest:'';
 return `<span class="club-crest15 ${size}" aria-hidden="true">${image?`<img src="${image}" alt="">`:'🛡️'}</span>`;
}
async function uploadCrest15(ev,teamId){
 const file=ev.target.files?.[0];if(!file)return;
 const team=db.teams.find(t=>t.id===teamId);if(!team)return;
 if(!file.type.startsWith('image/'))return alert('Escolha uma imagem da galeria.');
 if(file.size>12*1024*1024)return alert('A imagem é muito grande (limite: 12 MB).');
 try{
  const bitmap=await createImageBitmap(file);
  const max=200,ratio=Math.min(1,max/bitmap.width,max/bitmap.height);
  const w=Math.max(1,Math.round(bitmap.width*ratio)),h=Math.max(1,Math.round(bitmap.height*ratio));
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  canvas.getContext('2d').drawImage(bitmap,0,0,w,h);bitmap.close?.();
  const data=canvas.toDataURL('image/png');
  const previous=team.crest;team.crest=data;
  try{localStorage.setItem(KEY,JSON.stringify(db));}catch(err){team.crest=previous;return alert('Espaço insuficiente no navegador. Exporte um backup e tente uma imagem menor.');}
  render();
 }catch(err){alert('Não foi possível processar esta imagem. Tente outra foto em PNG ou JPG.');}
}
function removeCrest15(teamId){
 const team=db.teams.find(t=>t.id===teamId);if(!team?.crest)return;
 if(!confirm('Remover o escudo deste clube?'))return;
 const previous=team.crest;delete team.crest;
 try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){team.crest=previous;return alert('Erro ao salvar.');}

}

// Adiciona escudos aos nomes dos clubes em partidas, rodadas, súmulas e classificação,
// sem alterar valores dos formulários ou a lógica de cálculo das estatísticas.
function decorateCrests15(){
 const root=$('app');if(!root)return;
 const candidates=[...root.querySelectorAll('b, td, .score, .match-card .teams b, h3')];
 const names=db.teams.filter(t=>t.name&&t.crest).sort((a,b)=>b.name.length-a.name.length);
 if(!names.length)return;
 for(const el of candidates){
  if(el.closest('.club-line15')||el.closest('button')||el.querySelector('.club-crest15'))continue;
  const nodes=[...el.childNodes].filter(n=>n.nodeType===Node.TEXT_NODE);
  for(const node of nodes){
   const raw=node.textContent;
   const matches=[];
   for(const t of names){let at=raw.indexOf(t.name);while(at!==-1){
    if(!matches.some(m=>at<m.end&&at+t.name.length>m.start))matches.push({start:at,end:at+t.name.length,t});
    at=raw.indexOf(t.name,at+t.name.length);
   }}
   if(!matches.length)continue;
   matches.sort((a,b)=>a.start-b.start);
   const fragment=document.createDocumentFragment();let pos=0;
   for(const m of matches){if(m.start<pos)continue;
    fragment.append(document.createTextNode(raw.slice(pos,m.start)));
    const holder=document.createElement('span');holder.innerHTML=crest15(m.t.id,'small');
    fragment.append(holder.firstElementChild);fragment.append(document.createTextNode(raw.slice(m.start,m.end)));pos=m.end;
   }
   fragment.append(document.createTextNode(raw.slice(pos)));node.replaceWith(fragment);
  }
 }
}

 const reason=red>0?'Cartão vermelho':yellow>=3?'3 cartões amarelos':'';
 return {yellow,red,reason,blocked:!!d.manualBlock||!!reason};
}

function saveTeamStats19(ev,mid){

 const f=new FormData(ev.target),next={};
 for(const [side,tid] of [['home',m.homeId],['away',m.awayId]]){
  next[tid]={};
  for(const [key,label] of statLabels19){
   const raw=String(f.get(side+'_'+key)??'').trim(),n=Number(raw);

}

 }
 for(const [m,raw] of changes){m.playerRatings??={};if(raw==='')delete m.playerRatings[pid];else m.playerRatings[pid]=Number(raw)}
 save();render();alert('Notas atualizadas!');

function suspensionStatus35(p,cid){
 if(!discComp30(cid))return {blocked:false,remaining:0,total:0};
 const d=suspensionRecord35(p,cid),totals=discTotals30(p,cid);
 let active=d.suspension35;
 if(active&&active.teamId!==p.teamId){
  // Transferências não devem consumir jogos de outro clube.
  active.finishedAtStart=finishedTeamGames35(p,cid);active.teamId=p.teamId;save();
 }
 if(!active){
  const y=Math.max(0,totals.yellow-statInt14(d.yellowCleared));
  const r=Math.max(0,totals.red-statInt14(d.redCleared));
  if(d.manualBlock||r>0||y>=3){

   activateSuspension35(p,cid,1,reason);active=d.suspension35;

 }
 if(!active)return {blocked:false,remaining:0,total:0};
 const before=new Set(active.finishedAtStart||[]);
 const served=finishedTeamGames35(p,cid).filter(mid=>!before.has(mid)).length;
 const remaining=Math.max(0,statInt14(active.total)-served);
 if(remaining===0){
  d.yellowCleared=totals.yellow;d.redCleared=totals.red;d.manualBlock=false;
  d.suspension35=null;save();
  return {blocked:false,remaining:0,total:statInt14(active.total),justCompleted:true};
