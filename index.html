<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251e"><link rel="manifest" href="manifest.json"><title>Central de Futebol</title><style>
:root{font-family:system-ui,Arial;background:#0b1714;color:#ecf7f1}*{box-sizing:border-box}body{margin:0}header{padding:20px;background:#142a22;border-bottom:1px solid #31513e}h1{margin:0;font-size:24px}small,.muted{color:#a7bdb2}nav{display:flex;overflow:auto;gap:7px;padding:12px;background:#0e2019;position:sticky;top:0;z-index:2}button,.btn{border:0;border-radius:9px;background:#284c39;color:white;padding:10px 13px;cursor:pointer;font:inherit}button.active,.primary{background:#65d68a;color:#092214;font-weight:700}button.danger{background:#743e3e}main{max-width:1100px;margin:auto;padding:15px}.panel{background:#15271f;border:1px solid #2d4938;border-radius:14px;padding:17px;margin:12px 0}h2{margin:0 0 12px}h3{margin:10px 0}input,select,textarea{background:#0c1c16;border:1px solid #45614f;border-radius:8px;padding:10px;color:white;font:inherit;width:100%;margin:5px 0 10px}label{display:block;font-size:13px;color:#c4d6cb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.item{border-bottom:1px solid #35503e;padding:10px 0}.item:last-child{border:0}.pill{background:#2b4737;border-radius:20px;padding:3px 9px;font-size:12px}.score{font-size:32px;font-weight:800;text-align:center}.right{float:right}.hide{display:none}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 5px;text-align:left;border-bottom:1px solid #34513f} .scroll{overflow:auto}.notice{background:#3b3923;padding:10px;border-radius:8px}a{color:#7de69f}textarea{min-height:85px} @media(max-width:600px){header{padding:14px}nav button{white-space:nowrap}main{padding:10px}}
</style></head><body><header><h1>⚽ Central de Futebol</h1><small>Seu universo de futebol fictício, organizado.</small></header><nav id="nav"></nav><main id="app"></main><script>
const KEY='central-futebol-v1';let db;const empty=()=>({teams:[],players:[],competitions:[],matches:[]});try{db=JSON.parse(localStorage.getItem(KEY))||empty()}catch{db=empty()}for(const k of Object.keys(empty()))db[k]??=[];let tab='inicio',edit={},selectedMatch='',selectedCompetition='';const id=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const name=(type,i)=>db[type].find(x=>x.id===i)?.name||'Não encontrado';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Não foi possível salvar. Exporte um backup.')}};const $=x=>document.getElementById(x);const options=(type,val='',filter=()=>true)=>`<option value="">Selecione</option>`+db[type].filter(filter).map(x=>`<option value="${esc(x.id)}" ${x.id===val?'selected':''}>${esc(x.name)}</option>`).join('');const field=(label,key,value='',type='text',extra='')=>`<label>${label}<input name="${key}" type="${type}" value="${esc(value)}" ${extra}></label>`;const select=(label,key,type,value='',filter)=>`<label>${label}<select name="${key}">${options(type,value,filter)}</select></label>`;const buttons=(type,x)=>`<button onclick="startEdit('${type}','${x.id}')">Editar</button> <button class="danger" onclick="removeItem('${type}','${x.id}')">Excluir</button>`;
const tabs=[['inicio','🏠 Início'],['teams','🛡️ Clubes'],['players','👤 Jogadores'],['competitions','🏆 Campeonatos'],['rounds','🗓️ Rodadas'],['matches','⚽ Partidas'],['stats','📊 Estatísticas'],['backup','💾 Backup']];function go(t){tab=t;edit={};render()}function startEdit(t,i){tab=t;edit[t]=db[t].find(x=>x.id===i);render();window.scrollTo(0,0)}function removeItem(t,i){if(!confirm('Excluir este registro? Referências em outros registros podem ficar sem vínculo.'))return;db[t]=db[t].filter(x=>x.id!==i);save();render()}function formSubmit(e,t){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));const old=edit[t];if(t==='matches'&&(!o.homeId||!o.awayId||o.homeId===o.awayId))return alert('Escolha dois clubes diferentes.');if(old)Object.assign(old,o);else db[t].push({...o,id:id(),...(t==='matches'?{events:[]}: {})});edit={};save();render()}
function render(){ $('nav').innerHTML=tabs.map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');$('app').innerHTML=({inicio:home,teams:teams,players:players,competitions:competitions,rounds:rounds,matches:matches,stats:stats,backup:backup})[tab]();}
function home(){const goals=db.matches.flatMap(m=>m.events||[]).filter(e=>e.type==='goal').length;return `<div class="grid">${[['Clubes',db.teams.length],['Jogadores',db.players.length],['Campeonatos',db.competitions.length],['Partidas',db.matches.length],['Gols',goals]].map(([a,b])=>`<div class="panel"><small>${a}</small><div class="score">${b}</div></div>`).join('')}</div><div class="panel"><h2>Bem-vindo à Central</h2><p>Cadastre clubes e jogadores, crie um campeonato e registre suas partidas. Gols e cartões atualizam automaticamente as súmulas e estatísticas.</p><button class="primary" onclick="go('teams')">Começar pelos clubes</button></div>`}
function teams(){let x=edit.teams||{};return `<div class="panel"><h2>${x.id?'Editar':'Novo'} clube</h2><form onsubmit="formSubmit(event,'teams')">${field('Nome','name',x.name,'text','required')}${field('Cidade','city',x.city)}${field('País','country',x.country)}<button class="primary">Salvar clube</button></form></div><div class="panel"><h2>Clubes (${db.teams.length})</h2>${db.teams.map(x=>`<div class="item"><b>${esc(x.name)}</b> <small>${esc(x.city)} ${esc(x.country)}</small><div class="actions">${buttons('teams',x)}</div></div>`).join('')||'Nenhum clube cadastrado.'}</div>`}
function players(){let x=edit.players||{};return `<div class="panel"><h2>${x.id?'Editar':'Novo'} jogador</h2><form onsubmit="formSubmit(event,'players')"><div class="grid">${field('Nome','name',x.name,'text','required')}${select('Clube','teamId','teams',x.teamId)}${field('Número','number',x.number,'number','min="0"')}${field('Posição','position',x.position)}${field('Nacionalidade','nationality',x.nationality)}${field('Idade','age',x.age,'number','min="0"')}</div><button class="primary">Salvar jogador</button></form></div><div class="panel"><h2>Jogadores (${db.players.length})</h2>${db.players.map(x=>`<div class="item"><b>${esc(x.name)}</b> <span class="pill">#${esc(x.number||'?')}</span><p class="muted">${esc(name('teams',x.teamId))} · ${esc(x.position)}</p><div class="actions">${buttons('players',x)}</div></div>`).join('')||'Nenhum jogador cadastrado.'}</div>`}
function competitions(){let x=edit.competitions||{};return `<div class="panel"><h2>${x.id?'Editar':'Novo'} campeonato</h2><form onsubmit="formSubmit(event,'competitions')">${field('Nome','name',x.name,'text','required')}${field('Temporada','season',x.season||'2026')}${field('Descrição','description',x.description)}<button class="primary">Salvar campeonato</button></form></div><div class="panel"><h2>Campeonatos</h2>${db.competitions.map(x=>`<div class="item"><b>${esc(x.name)}</b> <small>${esc(x.season)}</small><div class="actions">${buttons('competitions',x)} <button onclick="selectedCompetition='${x.id}';go('rounds')">🗓️ Rodadas</button></div></div>`).join('')||'Nenhum campeonato cadastrado.'}</div>`}
function roundRobin(ids){let a=[...ids];if(a.length%2)a.push(null);const n=a.length,out=[];for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)pairs.push(r%2?[y,x]:[x,y])}out.push(pairs);a=[a[0],a[n-1],...a.slice(1,n-1)]}return out}
function generateRounds(ev){ev.preventDefault();const f=new FormData(ev.target),cid=f.get('competitionId'),ids=f.getAll('teams');if(!cid)return alert('Selecione um campeonato.');if(ids.length<2)return alert('Escolha pelo menos dois clubes.');if(db.matches.some(m=>m.competitionId===cid)&&!confirm('Este campeonato já tem partidas. Adicionar rodadas ao calendário existente?'))return;const existing=db.matches.filter(m=>m.competitionId===cid);let start=Math.max(0,...existing.map(m=>Number(m.round)||0))+1;const first=roundRobin(ids);let all=[...first];if(f.get('format')==='double')all.push(...first.map(r=>r.map(([h,a])=>[a,h])));for(let r=0;r<all.length;r++)for(const [homeId,awayId] of all[r])db.matches.push({id:id(),homeId,awayId,competitionId:cid,round:String(start+r),date:'',stadium:'',referee:'',status:'scheduled',events:[]});selectedCompetition=cid;save();render();alert(all.length+' rodadas criadas!')}
function createRound(ev){ev.preventDefault();const f=new FormData(ev.target),cid=f.get('competitionId');if(!cid)return alert('Selecione um campeonato.');const next=Math.max(0,...db.matches.filter(m=>m.competitionId===cid).map(m=>Number(m.round)||0))+1;db.matches.push({id:id(),homeId:f.get('homeId'),awayId:f.get('awayId'),competitionId:cid,round:String(f.get('round')||next),date:f.get('date')||'',stadium:'',referee:'',status:'scheduled',events:[]});const m=db.matches.at(-1);if(!m.homeId||!m.awayId||m.homeId===m.awayId){db.matches.pop();return alert('Escolha dois clubes diferentes.')}selectedCompetition=cid;save();render()}
function rounds(){const cid=selectedCompetition||db.competitions[0]?.id||'';selectedCompetition=cid;const cm=db.matches.filter(m=>m.competitionId===cid).sort((a,b)=>(Number(a.round)||0)-(Number(b.round)||0));const groups={};for(const m of cm)(groups[m.round||'Sem rodada']??=[]).push(m);return `<div class="panel"><h2>🗓️ Calendário de rodadas</h2><label>Campeonato<select onchange="selectedCompetition=this.value;render()">${options('competitions',cid)}</select></label><p class="muted">Selecione os clubes participantes e gere o calendário. Você pode editar cada confronto, data, horário e súmula depois.</p></div><div class="panel"><h3>Gerar automaticamente</h3><form onsubmit="generateRounds(event)"><input type="hidden" name="competitionId" value="${esc(cid)}"><label>Formato<select name="format"><option value="single">Turno único</option><option value="double">Ida e volta</option></select></label><p>Clubes participantes:</p><div class="grid">${db.teams.map(t=>`<label><input style="width:auto;margin-right:8px" type="checkbox" name="teams" value="${esc(t.id)}" checked>${esc(t.name)}</label>`).join('')||'Cadastre clubes primeiro.'}</div><p class="muted">Com número ímpar de clubes, uma equipe folga por rodada.</p><button class="primary" ${!cid?'disabled':''}>⚡ Gerar rodadas</button></form></div><div class="panel"><h3>Adicionar confronto manualmente</h3><form onsubmit="createRound(event)"><input type="hidden" name="competitionId" value="${esc(cid)}"><div class="grid">${select('Mandante','homeId','teams')}${select('Visitante','awayId','teams')}${field('Rodada (opcional)','round','','number','min="1"')}${field('Data','date','','date')}</div><button class="primary" ${!cid?'disabled':''}>Adicionar partida</button></form></div>${Object.entries(groups).map(([r,ms])=>`<div class="panel"><h3>Rodada ${esc(r)}</h3>${ms.map(m=>{let [h,a]=score(m);return `<div class="item"><b>${esc(name('teams',m.homeId))} ${h} × ${a} ${esc(name('teams',m.awayId))}</b><p class="muted">${esc(m.date||'Data a definir')} · ${m.status==='finished'?'Finalizada':m.status==='live'?'Em andamento':'Agendada'}</p><div class="actions"><button onclick="startEdit('matches','${m.id}')">Editar confronto</button><button class="primary" onclick="selectedMatch='${m.id}';tab='report';render()">Abrir súmula</button><button class="danger" onclick="removeItem('matches','${m.id}')">Excluir</button></div></div>`}).join('')}</div>`).join('')||'<div class="panel">Nenhuma rodada criada neste campeonato.</div>'}`}
function score(m){let h=0,a=0;for(const e of m.events||[])if(e.type==='goal'){if(e.teamId===m.homeId)h++;if(e.teamId===m.awayId)a++}return [h,a]}
function matches(){let x=edit.matches||{};return `<div class="panel"><h2>${x.id?'Editar':'Nova'} partida</h2><form onsubmit="formSubmit(event,'matches')"><div class="grid">${select('Mandante','homeId','teams',x.homeId)}${select('Visitante','awayId','teams',x.awayId)}${select('Campeonato','competitionId','competitions',x.competitionId)}${field('Data','date',x.date||new Date().toISOString().slice(0,10),'date')}${field('Rodada','round',x.round,'number','min="1"')}${field('Estádio','stadium',x.stadium)}${field('Árbitro','referee',x.referee)}</div><label>Estado<select name="status"><option value="scheduled" ${x.status==='scheduled'?'selected':''}>Agendada</option><option value="live" ${x.status==='live'?'selected':''}>Em andamento</option><option value="finished" ${x.status==='finished'?'selected':''}>Finalizada</option></select></label><button class="primary">Salvar partida</button></form></div><div class="panel"><h2>Partidas</h2>${db.matches.map(m=>{let [h,a]=score(m);return `<div class="item"><b>${esc(name('teams',m.homeId))} ${h} × ${a} ${esc(name('teams',m.awayId))}</b><p class="muted">${esc(m.date)} · Rodada ${esc(m.round||'?')} · ${esc(name('competitions',m.competitionId))} · ${m.status==='finished'?'Finalizada':m.status==='live'?'Em andamento':'Agendada'}</p><div class="actions"><button class="primary" onclick="selectedMatch='${m.id}';tab='report';render()">Abrir súmula</button>${buttons('matches',m)}</div></div>`}).join('')||'Nenhuma partida cadastrada.'}</div>`}
const types={goal:'⚽ Gol',yellow:'🟨 Cartão amarelo',red:'🟥 Cartão vermelho',sub:'🔁 Substituição',note:'📝 Observação'};
function report(){let m=db.matches.find(x=>x.id===selectedMatch);if(!m){tab='matches';return matches()}let [h,a]=score(m),events=[...(m.events||[])].sort((a,b)=>Number(a.minute)-Number(b.minute));return `<div class="actions"><button onclick="go('matches')">← Partidas</button><button onclick="print()">Imprimir / PDF</button></div><div class="panel"><small>${esc(name('competitions',m.competitionId))} · ${esc(m.date)} · ${esc(m.round||'')}</small><div class="score">${esc(name('teams',m.homeId))}<br>${h} × ${a}<br>${esc(name('teams',m.awayId))}</div><p>Estádio: ${esc(m.stadium||'Não informado')} | Árbitro: ${esc(m.referee||'Não informado')}</p></div><div class="panel"><h2>Adicionar evento</h2><form onsubmit="addEvent(event,'${m.id}')"><div class="grid">${field('Minuto','minute','','number','min="0" required')}<label>Tipo<select name="type">${Object.entries(types).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Equipe<select name="teamId" id="eventTeam" onchange="updateEventPlayers('${m.id}')"><option value="${esc(m.homeId)}">${esc(name('teams',m.homeId))}</option><option value="${esc(m.awayId)}">${esc(name('teams',m.awayId))}</option></select></label><label>Jogador<select name="playerId" id="eventPlayer"></select></label><label>Assistência / jogador que sai<select name="secondaryId" id="eventSecondary"></select></label></div><label>Observação<textarea name="note"></textarea></label><button class="primary">Registrar evento</button></form></div><div class="panel"><h2>Súmula e linha do tempo</h2>${events.map(e=>`<div class="item"><b>${esc(e.minute)}' ${types[e.type]||esc(e.type)}</b> · ${esc(name('teams',e.teamId))}<p>${esc(name('players',e.playerId))}${e.secondaryId?' · '+(e.type==='goal'?'Assistência: ':'Relacionado: ')+esc(name('players',e.secondaryId)):''}</p><small>${esc(e.note||'')}</small><div><button onclick="editEvent('${m.id}','${e.id}')">Editar evento</button> <button class="danger" onclick="deleteEvent('${m.id}','${e.id}')">Excluir evento</button></div></div>`).join('')||'Sem eventos registrados.'}</div><div class="panel"><h2>Escalações por clube</h2>${[m.homeId,m.awayId].map(t=>`<h3>${esc(name('teams',t))}</h3>${db.players.filter(p=>p.teamId===t).map(p=>`<span class="pill">${esc(p.number||'')} ${esc(p.name)}</span> `).join('')||'Nenhum jogador cadastrado.'}`).join('')}</div>`}
function updateEventPlayers(mid){let t=$('eventTeam')?.value;let o='<option value="">Selecione</option>'+db.players.filter(p=>p.teamId===t).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('eventPlayer').innerHTML=o;$('eventSecondary').innerHTML=o}function addEvent(ev,mid){ev.preventDefault();let m=db.matches.find(x=>x.id===mid),e=Object.fromEntries(new FormData(ev.target));if(e.type==='goal'&&!e.playerId)return alert('Selecione o autor do gol.');m.events??=[];m.events.push({...e,id:id()});save();render()}function editEvent(mid,eid){let m=db.matches.find(x=>x.id===mid),e=m.events.find(x=>x.id===eid);let minute=prompt('Minuto do evento:',e.minute);if(minute===null)return;if(!/^\d+$/.test(minute))return alert('Minuto inválido');let note=prompt('Observação:',e.note||'');if(note===null)return;e.minute=minute;e.note=note;save();render()}function deleteEvent(mid,eid){if(!confirm('Excluir evento?'))return;let m=db.matches.find(x=>x.id===mid);m.events=m.events.filter(e=>e.id!==eid);save();render()}
function stats(){let s={};for(const p of db.players)s[p.id]={player:p,goals:0,assists:0,yellow:0,red:0};for(const m of db.matches)for(const e of m.events||[]){if(s[e.playerId]){if(e.type==='goal')s[e.playerId].goals++;if(e.type==='yellow')s[e.playerId].yellow++;if(e.type==='red')s[e.playerId].red++}if(e.type==='goal'&&s[e.secondaryId])s[e.secondaryId].assists++}let arr=Object.values(s);let finished=db.matches.filter(m=>m.status==='finished');let table=db.teams.map(t=>{let o={team:t,pts:0,p:0,w:0,d:0,l:0,gf:0,ga:0};for(const m of finished){if(m.homeId!==t.id&&m.awayId!==t.id)continue;let [h,a]=score(m),gf=m.homeId===t.id?h:a,ga=m.homeId===t.id?a:h;o.p++;o.gf+=gf;o.ga+=ga;if(gf>ga){o.w++;o.pts+=3}else if(gf===ga){o.d++;o.pts++}else o.l++}return o}).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);return `<div class="panel"><h2>Classificação geral</h2><small>Somente partidas finalizadas; todos os campeonatos juntos.</small><div class="scroll"><table><tr><th>Clube</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr>${table.map(o=>`<tr><td>${esc(o.team.name)}</td><td>${o.pts}</td><td>${o.p}</td><td>${o.w}</td><td>${o.d}</td><td>${o.l}</td><td>${o.gf-o.ga}</td></tr>`).join('')}</table></div></div><div class="panel"><h2>Estatísticas dos jogadores</h2><div class="scroll"><table><tr><th>Jogador</th><th>Gols</th><th>Assist.</th><th>🟨</th><th>🟥</th></tr>${arr.sort((a,b)=>b.goals-a.goals||b.assists-a.assists).map(o=>`<tr><td>${esc(o.player.name)}</td><td>${o.goals}</td><td>${o.assists}</td><td>${o.yellow}</td><td>${o.red}</td></tr>`).join('')}</table></div></div>`}
function backup(){return `<div class="panel"><h2>Backup dos seus dados</h2><p>Os dados ficam neste navegador. Exporte regularmente para não perdê-los ao limpar os dados do aplicativo.</p><div class="actions"><button class="primary" onclick="exportBackup()">Exportar JSON</button><label class="btn">Importar JSON<input type="file" accept="application/json,.json" onchange="importBackup(event)" style="display:none"></label></div></div><div class="panel"><h2>Sobre</h2><p>Versão 1.1. Funciona offline após carregar os arquivos localmente ou após instalação em servidor com HTTPS e service worker.</p></div>`}
function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='central-futebol-backup.json';a.click();URL.revokeObjectURL(u)}async function importBackup(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!['teams','players','competitions','matches'].every(k=>Array.isArray(d[k])))throw Error('Formato inválido');if(!confirm('Substituir todos os dados atuais pelo backup?'))return;db=d;save();go('inicio')}catch(err){alert('Falha na importação: '+err.message)}}
const oldRender=render;render=function(){if(tab==='report'){$('nav').innerHTML=tabs.map(([k,v])=>`<button onclick="go('${k}')">${v}</button>`).join('');$('app').innerHTML=report();updateEventPlayers(selectedMatch)}else oldRender()};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
